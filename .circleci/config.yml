jobs:
  hash-450:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Ship the artifact registry carefully
          command: |
            mkdir -p /tmp/stage-cache
            set +o pipefail 2>/dev/null; awk 'BEGIN{print "key,val"; for(i=1;i<=100000;i++) print "k"i","i}' > /tmp/stage-cache/cfg_Chrome-slice; true
            echo "bytes: $(wc -c </tmp/stage-cache/cfg_Chrome-slice)"
      - persist_to_workspace:
          root: /tmp/stage-cache
          paths:
            - 'cfg_Chrome-slice'
  v8-alpha1:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/stage-cache
      - run:
          name: Check workspace state
          command: |
            dd if=/tmp/stage-cache/v0.14.30 bs=100 count=2 2>/dev/null | head -c 50 | wc -c || true
      - run:
          name: Fetch repo
          command: git clone --depth 2 --quiet --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore build cache
          command: tar --extract --bzip2 --file=index-v4.tar.bz2
      - run:
          name: Finalize build
          command: ls -la
      - run:
          command: df -h
      - run:
          command: /bin/sh -c "./schedule-rc1"
